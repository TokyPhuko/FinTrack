<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}FinTrack{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <meta name="telegram-web-app" content="">
</head>
<body>
  <div id="impersonate-banner" class="impersonate-banner" style="display:none">
    <span id="impersonate-text">Просмотр чужого аккаунта</span>
    <button type="button" class="btn btn-sm" id="impersonate-exit">↩ Вернуться в админку</button>
  </div>
  <header class="topbar">
    <div class="brand"><a href="/">FinTrack</a></div>
    <nav class="nav">
      <a href="/" class="nav-link {% if active == 'home' %}active{% endif %}">Главная</a>
      <a href="/transactions" class="nav-link {% if active == 'transactions' %}active{% endif %}">Траты</a>
      <a href="/plans" class="nav-link {% if active == 'plans' %}active{% endif %}">Планы</a>
      <a href="/budgets" class="nav-link {% if active == 'budgets' %}active{% endif %}">Бюджеты</a>
      <a href="/accounts" class="nav-link {% if active == 'accounts' %}active{% endif %}">Счета</a>
      <a href="/deposits" class="nav-link {% if active == 'deposits' %}active{% endif %}">Вклады</a>
      <a href="/categories" class="nav-link {% if active == 'categories' %}active{% endif %}">Категории</a>
      <a href="/reports" class="nav-link {% if active == 'reports' %}active{% endif %}">Отчёты</a>
      <a href="/chat" class="nav-link {% if active == 'chat' %}active{% endif %}">Чат</a>
      {% if user and user.is_admin %}
      <a href="/admin" class="nav-link {% if active == 'admin' %}active{% endif %}">Админка</a>
      {% endif %}
    </nav>
    <div class="user">
      <span class="muted hide-sm">{{ user.username }}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="btn btn-ghost">Выйти</button>
      </form>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script>
    (async function () {
      try {
        const r = await fetch("/api/admin/impersonation", { headers: { Accept: "application/json" } });
        if (!r.ok) return;
        const d = await r.json();
        if (d.impersonating) {
          const b = document.getElementById("impersonate-banner");
          document.getElementById("impersonate-text").textContent =
            "👁 Вы в аккаунте «" + d.as + "» (режим просмотра админа)";
          b.style.display = "flex";
          document.getElementById("impersonate-exit").onclick = async () => {
            await fetch("/api/admin/exit-impersonate", { method: "POST" });
            window.location.href = "/admin";
          };
        }
      } catch (e) {}
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
