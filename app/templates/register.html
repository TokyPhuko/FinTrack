<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinTrack — регистрация</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>FinTrack</h1>
    <p class="muted">Новый аккаунт — логин = имя пользователя</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/register" class="stack">
      <label>Логин
        <input type="text" name="username" required minlength="2" maxlength="64"
               autocomplete="username" autofocus placeholder="например: toky">
      </label>
      <label>Пароль
        <input type="password" name="password" required minlength="3"
               autocomplete="new-password" placeholder="минимум 3 символа">
      </label>
      <label>Повтори пароль
        <input type="password" name="password2" required minlength="3"
               autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn-primary">Создать аккаунт</button>
    </form>
    <p class="muted small" style="margin-top:12px;text-align:center">
      Уже есть аккаунт? <a href="/login">Войти</a>
    </p>
  </main>
</body>
</html>
